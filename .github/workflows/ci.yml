name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Shipped dependencies block at moderate; dev tooling (test runner,
      # packager) blocks at high. The packager's remaining moderate findings
      # (minimatch < 11.0.1 via electron-builder) have no upstream fix yet.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cli:build

  e2e:
    # Launches the built desktop app and checks it really starts: a window
    # opens, the preload bridge works, React renders, IPC round-trips, and
    # navigation stays inside the app. Unit tests run in Node and missed
    # startup crashes that only exist in the Electron runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke
          path: e2e-artifacts/
          if-no-files-found: ignore
